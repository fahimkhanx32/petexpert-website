<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/petexpertlogo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pet Expert – Dhaka: veterinary clinic for wellness exams, vaccinations, dental care, surgery, diagnostics and emergency care." />
    <title>Pet Expert – Dhaka | Veterinary Clinic</title>
    <!-- Sets the saved (or device) theme before the page paints, so there is no light/dark flash -->
    <script>
      try {
        var saved = localStorage.getItem('petexpert_theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
